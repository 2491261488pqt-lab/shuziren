<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="../assets/css/tailwind.css">
<link rel="stylesheet" href="../assets/css/fonts.css">
</head>
<body class="bg-background text-on-background antialiased min-h-screen font-body-md text-body-md overflow-x-hidden flex">
<aside class="w-sidebar-width h-screen fixed left-0 top-0 bg-surface border-r border-surface-container-highest flex flex-col z-50"><div class="px-6 py-8 flex flex-col items-center"><img alt="Hainan University Logo" class="h-12 w-auto object-contain mb-4" src="../assets/images/logo-brand.png"><h1 class="font-headline-sm text-headline-sm font-bold text-primary">Digital Human AI</h1><p class="font-label-md text-label-md text-outline">Hainan University</p></div><nav class="flex-1 mt-4 px-3 space-y-1"><a class="text-on-surface-variant hover:bg-surface-container-low flex items-center px-4 py-3 rounded-sm transition-colors duration-200" href="index.html"><span class="material-symbols-outlined mr-3">dashboard</span><span class="font-label-md text-label-md">业务总览</span></a><a class="sidebar-active flex items-center px-4 py-3 rounded-sm transition-colors duration-200" href="micro-lecture-agent.html"><span class="material-symbols-outlined mr-3">video_call</span><span class="font-label-md text-label-md">微课智能体</span></a><a class="text-on-surface-variant hover:bg-surface-container-low flex items-center px-4 py-3 rounded-sm transition-colors duration-200" href="video-management.html"><span class="material-symbols-outlined mr-3">video_library</span><span class="font-label-md text-label-md">视频管理</span></a><a class="text-on-surface-variant hover:bg-surface-container-low flex items-center px-4 py-3 rounded-sm transition-colors duration-200" href="asset-management.html"><span class="material-symbols-outlined mr-3">folder_open</span><span class="font-label-md text-label-md">资产管理</span></a><a class="text-on-surface-variant hover:bg-surface-container-low flex items-center px-4 py-3 rounded-sm transition-colors duration-200" href="system-settings.html"><span class="material-symbols-outlined mr-3">settings</span><span class="font-label-md text-label-md">系统设置</span></a></nav><div class="p-4 mt-auto"><div class="bg-primary-fixed p-4 rounded-xl flex items-center gap-3"><div class="w-10 h-10 rounded-full overflow-hidden bg-primary shadow-sm"><img class="w-full h-full object-cover" src="../assets/images/user-avatar.png"></div><div class="flex-1 min-w-0"><p class="font-label-md text-label-md font-bold text-on-primary-fixed truncate">管理员</p><p class="text-[10px] text-on-primary-fixed-variant truncate">高级账户</p></div><a href="../Login/login/index.html" class="material-symbols-outlined text-on-primary-fixed-variant cursor-pointer hover:text-error transition-colors" title="退出登录">logout</a></div></div></aside>
<header class="h-16 fixed top-0 right-0 left-sidebar-width z-40 bg-surface flex items-center justify-between px-6 border-b border-surface-container-highest"><div class="flex items-center gap-4"><div class="flex items-center text-outline font-body-sm text-body-sm"><a href="index.html" class="hover:text-primary transition-colors">业务总览</a><span class="material-symbols-outlined text-sm mx-2">chevron_right</span><a href="micro-lecture-agent.html" class="hover:text-primary transition-colors">微课智能体</a><span class="material-symbols-outlined text-sm mx-2">chevron_right</span><a href="script-processing.html" class="hover:text-primary transition-colors">讲稿处理/生成</a><span class="material-symbols-outlined text-sm mx-2">chevron_right</span><span class="text-primary font-bold">新建脚本</span></div></div><div class="flex items-center gap-6"><div class="relative group"><div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none"><span class="material-symbols-outlined text-outline text-lg">search</span></div><input class="block w-80 pl-10 pr-3 py-1.5 bg-surface-container border border-transparent focus:border-primary focus:ring-4 focus:ring-primary-fixed/50 rounded-full font-body-sm text-body-sm transition-all" placeholder="搜索..." type="text"></div><div class="flex items-center gap-4 text-on-surface-variant"><a href="notifications.html" class="relative hover:text-primary transition-colors"><span class="material-symbols-outlined">notifications</span><span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-error ring-2 ring-surface"></span></a><a href="help-center.html" class="hover:text-primary transition-colors flex items-center gap-1"><span class="material-symbols-outlined">help_outline</span><span class="font-body-sm text-body-sm">帮助</span></a></div></div></header>
<!-- Main Canvas -->
<main class="ml-sidebar-width mt-16 p-xl flex flex-col items-center justify-center" style="width:calc(100% - 240px); min-height:calc(100vh - 64px)">
<div class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant p-xl overflow-hidden relative">
<!-- Decorative Background Element -->
<div class="absolute top-0 right-0 w-64 h-64 bg-primary-fixed-dim rounded-full blur-3xl opacity-20 -mr-20 -mt-20 pointer-events-none"></div>
<div class="relative z-10">
<header class="mb-xl text-center">
<h1 class="font-display-lg text-display-lg text-on-surface mb-2">新建脚本</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Create New Project</p>
</header>
<form class="space-y-xl max-w-2xl mx-auto">
<!-- Project Name Input -->
<div class="space-y-sm">
<label class="block font-title-lg text-title-lg text-on-surface" for="projectName">项目名称 <span class="text-error">*</span></label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all duration-200 shadow-sm placeholder-on-surface-variant/50" id="projectName" name="projectName" placeholder="输入微课项目名称..." type="text"/>
<span class="material-symbols-outlined absolute right-md top-1/2 transform -translate-y-1/2 text-on-surface-variant pointer-events-none">edit</span>
</div>
</div>
<!-- Creation Mode Selection (Bento Grid Style) -->
<div class="space-y-md">
<label class="block font-title-lg text-title-lg text-on-surface">创作模式 <span class="text-on-surface-variant text-sm font-normal ml-2">(请选择一种模式)</span></label>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Mode 1: Create from Scratch -->
<label class="cursor-pointer group">
<input checked="" class="peer sr-only" name="creationMode" type="radio" value="scratch"/>
<div class="h-full bg-surface border-2 border-outline-variant rounded-xl p-lg transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary-fixed/30 peer-checked:shadow-md hover:border-primary/50 hover:shadow-sm relative overflow-hidden">
<div class="flex items-start gap-md">
<div class="w-12 h-12 rounded-lg bg-primary-container/20 flex items-center justify-center text-primary group-hover:scale-110 transition-transform duration-300">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">draw</span>
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">从头创作</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">手动输入内容或使用AI助手辅助生成完整教案。</p>
</div>
</div>
<!-- Active Indicator -->
<div class="absolute top-4 right-4 opacity-0 peer-checked:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
<!-- Mode 2: Import from Document -->
<label class="cursor-pointer group">
<input class="peer sr-only" name="creationMode" type="radio" value="import"/>
<div class="h-full bg-surface border-2 border-outline-variant rounded-xl p-lg transition-all duration-300 peer-checked:border-primary peer-checked:bg-primary-fixed/30 peer-checked:shadow-md hover:border-primary/50 hover:shadow-sm relative overflow-hidden">
<div class="flex items-start gap-md">
<div class="w-12 h-12 rounded-lg bg-surface-variant flex items-center justify-center text-on-surface-variant group-hover:scale-110 transition-transform duration-300 group-hover:text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">document_scanner</span>
</div>
<div class="flex-1">
<h3 class="font-title-lg text-title-lg text-on-surface mb-1">课件解析</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">导入已有的PPT或PDF文档，智能提取并转化为数字人脚本。</p>
</div>
</div>
<!-- Active Indicator -->
<div class="absolute top-4 right-4 opacity-0 peer-checked:opacity-100 transition-opacity duration-300">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</div>
</label>
</div>
</div>
<!-- Submit Button Area -->
<div class="pt-lg border-t border-outline-variant mt-xl flex justify-end">
<button class="bg-primary text-on-primary font-title-lg text-title-lg px-xl py-sm rounded-full shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex items-center gap-2 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="button">
<span>开始创作</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
</div>
</main>
</body></html>
