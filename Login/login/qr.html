        .glass-effect {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);

        }
        .shimmer-bg {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.2) 50%, rgba(255,255,255,0) 100%);

<script>
    // Ripple Effect for buttons
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('mousedown', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const ripple = document.createElement('span');
            ripple.style.cssText = 'position:absolute;width:100px;height:100px;background:rgba(255,255,255,0.3);border-radius:50%;left:'+(x-50)+'px;top:'+(y-50)+'px;transform:scale(0);animation:ripple 0.6s linear;pointer-events:none';
            this.style.position = 'relative';
            this.style.overflow = 'hidden';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    });
</script>
