<script>
    // --- Login Simulation ---
    const DEMO_ACCOUNT = { username: '2024001', password: 'hainu@123' };

    const form = document.getElementById('account-form');
    const usernameInput = document.getElementById('account-username');
    const pwdInput = document.getElementById('account-password');
    const errorBox = document.getElementById('account-error');
    const errorMsg = document.getElementById('account-error-msg');
    const submitBtn = document.getElementById('account-submit');
    const submitText = document.getElementById('account-submit-text');
    const submitIcon = document.getElementById('account-submit-icon');
    const spinner = document.getElementById('account-spinner');

    function setLoading(loading) {
        submitBtn.disabled = loading;
        if (loading) {
            submitText.classList.add('hidden');
            submitIcon.classList.add('hidden');
            spinner.classList.remove('hidden');
            submitBtn.classList.add('opacity-70');
        } else {
            submitText.classList.remove('hidden');
            submitIcon.classList.remove('hidden');
            spinner.classList.add('hidden');
            submitBtn.classList.remove('opacity-70');
        }
    }

    function showError(msg) {
        errorMsg.textContent = msg;
        errorBox.classList.remove('hidden');
    }

    function hideError() {
        errorBox.classList.add('hidden');
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        hideError();

        const username = usernameInput.value.trim();
        const password = pwdInput.value;

        // Field validation
        if (!username) { showError('请输入学号或工号'); usernameInput.focus(); return; }
        if (!password) { showError('请输入密码'); pwdInput.focus(); return; }

        // Simulate network request
        setLoading(true);
        setTimeout(() => {
            setLoading(false);
            if (username === DEMO_ACCOUNT.username && password === DEMO_ACCOUNT.password) {
                // Add shake animation to error inputs first? No, success!
                submitText.textContent = '登录成功';
                submitIcon.textContent = 'check';
                submitBtn.classList.add('bg-secondary');
                submitBtn.classList.remove('bg-primary');
                setTimeout(() => {
                    window.location.href = '../../dashboard/index.html';
                }, 600);
            } else {
                showError('学号/工号或密码错误，请重试');
                pwdInput.value = '';
                pwdInput.focus();
            }
        }, 1200);
    });

    // Toggle password visibility
    function togglePwd(id) {
        const input = document.getElementById(id);
        input.type = input.type === 'password' ? 'text' : 'password';
    }

    // Ripple Effect for buttons
    document.querySelectorAll('button').forEach(button => {
        button.addEventListener('mousedown', function(e) {
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const ripple = document.createElement('span');
            ripple.style.cssText = 'position:absolute;width:100px;height:100px;background:rgba(255,255,255,0.3);border-radius:50%;left:'+(x-50)+'px;top:'+(y-50)+'px;transform:scale(0);animation:ripple 0.6s linear;pointer-events:none';
            this.style.position = 'relative';
            this.style.overflow = 'hidden';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    });
</script>
