            </p>

<div class="px-md py-xs glass-effect rounded-full text-on-primary text-body-sm flex items-center gap-2">

<div class="lg:hidden absolute top-0 left-0 w-full h-32 bg-primary -z-10 rounded-b-[40px]"></div>
<div class="w-full max-w-[440px] px-md">
<div class="mb-xl">
<h2 class="font-headline-md text-headline-md text-on-surface mb-xs">管理员本地登录</h2>
<p class="font-body-md text-body-md text-on-surface-variant">请使用系统管理员账号登录后台管理系统</p>
</div>
<form class="space-y-lg" id="admin-form">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="admin-user">用户名</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">person</span>
</div>
<input class="w-full h-12 pl-11 pr-md bg-surface-container border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="admin-user" name="username" placeholder="请输入管理员账号" type="text" autocomplete="off">
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="admin-pwd">密码</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="w-full h-12 pl-11 pr-md bg-surface-container border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="admin-pwd" name="password" placeholder="请输入登录密码" type="password">
<button class="absolute inset-y-0 right-0 pr-md flex items-center text-outline hover:text-on-surface-variant" type="button" onclick="toggleAdminPwd()">
<span class="material-symbols-outlined text-[20px]" id="admin-pwd-icon">visibility_off</span>
</button>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="admin-captcha">验证码</label>
<div class="flex gap-md">
<div class="relative group flex-grow">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-outline group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]">verified_user</span>
</div>
<input class="w-full h-12 pl-11 pr-md bg-surface-container border border-outline-variant rounded-lg font-body-md focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all outline-none" id="admin-captcha" name="captcha" placeholder="输入验证码" type="text" autocomplete="off">
</div>
<div class="h-12 w-32 bg-surface-container-high rounded-lg flex items-center justify-center overflow-hidden border border-outline-variant cursor-pointer hover:bg-surface-variant transition-colors" onclick="this.querySelector('img').style.opacity='0.5';setTimeout(()=>this.querySelector('img').style.opacity='1',200);">
<img class="h-full w-auto transition-opacity" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCIQxmgEPFQ9m_PwT3rAat8z-_fgUhstDCMGz05Imhkp_MCXfL1ykK9WVvGXtKSr-8mQm0adCOB-vsIycJ8L5wqg_It8CMq-yatDK6wt6woUmu2SiJXVzG0ErkhEViC-a1mI-ZgGXJvWba5sOgDOSSYHiePX9qSqt3UwZGVW0hbHGGxl04q96zsW5xJ3lu0O3sntrecADtpr0_ONM41ZKbqzS09tiyEg-_PsNdSNZAaumakdDQNlb8z">
</div>
</div>
</div>
<!-- Error Message -->
<div class="hidden flex items-center gap-2 p-3 rounded-lg bg-error-container/50 border border-error/20" id="admin-error">
<span class="material-symbols-outlined text-error text-[18px]">error</span>
<p class="font-body-sm text-body-sm text-on-error-container" id="admin-error-msg"></p>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center">
<input class="w-4 h-4 text-primary border-outline-variant rounded focus:ring-primary" id="remember" name="remember" type="checkbox">
<label class="ml-xs font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">记住密码</label>
</div>
<a class="font-body-sm text-body-sm text-primary hover:underline transition-all" href="#">遇到问题？联系技术支持</a>
</div>
<button class="w-full h-12 bg-primary text-on-primary font-title-lg text-title-lg rounded-xl shadow-md hover:bg-primary-container hover:shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit" id="admin-submit">
<span id="admin-submit-text">立即登录</span>
<span class="hidden animate-spin material-symbols-outlined text-[20px]" id="admin-spinner">progress_activity</span>
</button>
</form>
<!-- Demo hint -->
<p class="text-center font-label-md text-label-md text-outline mt-4">演示账号：admin / admin@123（验证码任意）</p>
<div class="mt-xl">
<div class="relative flex items-center justify-center mb-lg">
<div class="w-full border-t border-outline-variant"></div>
<span class="absolute px-md bg-surface-container-lowest font-label-md text-label-md text-outline">或</span>
</div>
<a class="flex items-center justify-center gap-xs w-full py-md border border-primary text-primary font-title-lg text-title-lg rounded-xl hover:bg-primary/5 active:bg-primary/10 transition-all group" href="index.html">
<span class="material-symbols-outlined text-[20px] transition-transform group-hover:-translate-x-1">arrow_back</span>
                    海南大学统一身份认证
                </a>
</div>
</div>
<div class="absolute bottom-lg right-lg">
<button class="flex items-center gap-1 font-label-md text-label-md text-outline hover:text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]">language</span>
                简体中文
                <span class="material-symbols-outlined text-[16px]">expand_more</span>
</button>
</div>
</div>
<script>
    // --- Admin Login Simulation ---
    const DEMO_ADMIN = { username: 'admin', password: 'admin@123' };

    const adminForm = document.getElementById('admin-form');
    const adminUser = document.getElementById('admin-user');
    const adminPwd = document.getElementById('admin-pwd');
    const adminCaptcha = document.getElementById('admin-captcha');
    const adminError = document.getElementById('admin-error');
    const adminErrorMsg = document.getElementById('admin-error-msg');
    const adminSubmit = document.getElementById('admin-submit');
    const adminSubmitText = document.getElementById('admin-submit-text');
    const adminSpinner = document.getElementById('admin-spinner');

    function setLoading(loading) {
        adminSubmit.disabled = loading;
        if (loading) {
            adminSubmitText.classList.add('hidden');
            adminSpinner.classList.remove('hidden');
            adminSubmit.classList.add('opacity-70');
        } else {
            adminSubmitText.classList.remove('hidden');
            adminSpinner.classList.add('hidden');
            adminSubmit.classList.remove('opacity-70');
        }
    }

    function showAdminError(msg) {
        adminErrorMsg.textContent = msg;
        adminError.classList.remove('hidden');
    }

    function hideAdminError() {
        adminError.classList.add('hidden');
    }

    adminForm.addEventListener('submit', function(e) {
        e.preventDefault();
        hideAdminError();

        const username = adminUser.value.trim();
        const password = adminPwd.value;
        const captcha = adminCaptcha.value.trim();

        if (!username) { showAdminError('请输入管理员账号'); adminUser.focus(); return; }
        if (!password) { showAdminError('请输入登录密码'); adminPwd.focus(); return; }
        if (!captcha) { showAdminError('请输入验证码'); adminCaptcha.focus(); return; }

        setLoading(true);
        setTimeout(() => {
            setLoading(false);
            if (username === DEMO_ADMIN.username && password === DEMO_ADMIN.password) {
                adminSubmitText.textContent = '登录成功 ✓';
                adminSubmit.classList.add('bg-secondary');
                adminSubmit.classList.remove('bg-primary');
                setTimeout(() => {
                    window.location.href = '../../dashboard/index.html';
                }, 600);
            } else {
                showAdminError('账号或密码错误，请重试');
                adminPwd.value = '';
                adminCaptcha.value = '';
                adminPwd.focus();
            }
        }, 1200);
    });

    function toggleAdminPwd() {
        const icon = document.getElementById('admin-pwd-icon');
        if (adminPwd.type === 'password') {
            adminPwd.type = 'text';
            icon.textContent = 'visibility';
        } else {
            adminPwd.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    // Input focus micro-interactions
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.classList.add('scale-[1.01]');
        });
        input.addEventListener('blur', () => {
            input.parentElement.classList.remove('scale-[1.01]');
        });
    });
</script>
</body></html>
