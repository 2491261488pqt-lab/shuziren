<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PPT 导出参数配置</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",

                extend: {

                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#faf9f9",
                        "on-tertiary-container": "#fffbff",
                        "on-background": "#1b1c1c",
                        "on-primary-fixed-variant": "#004785",
                        "secondary-fixed": "#88fd54",
                        "tertiary-fixed-dim": "#ffba45",
                        "on-surface": "#1b1c1c",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#062100",
                        "tertiary-container": "#9d6a00",
                        "error-container": "#ffdad6",
                        "on-error-container": "#93000a",
                        "surface-tint": "#005fae",
                        "on-tertiary-fixed": "#281800",
                        "surface-container-low": "#f4f3f3",
                        "on-tertiary-fixed-variant": "#614000",
                        "on-surface-variant": "#404753",
                        "secondary-fixed-dim": "#6de039",
                        "outline": "#707785",
                        "on-primary-container": "#fefcff",
                        "tertiary": "#7d5400",
                        "background": "#faf9f9",
                        "primary": "#005daa",
                        "on-primary-fixed": "#001c3a",
                        "secondary": "#266d00",
                        "on-secondary-container": "#287100",
                        "outline-variant": "#c0c7d6",
                        "inverse-on-surface": "#f2f0f0",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2f3031",
                        "primary-fixed-dim": "#a5c8ff",
                        "surface-container-highest": "#e3e2e2",
                        "on-secondary-fixed-variant": "#1a5200",
                        "surface-dim": "#dbdad9",
                        "surface": "#faf9f9",
                        "primary-container": "#0075d5",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e9e8e8"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "xl": "32px",
                        "sidebar-width": "240px",
                        "xs": "8px",
                        "base": "4px",
                        "sm": "12px",
                        "md": "16px",
                        "lg": "24px",
                        "gutter": "16px",
                        "container-margin": "24px"
                    },
                    "fontFamily": {
                        "title-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "label-caps": ["Inter"],
                        "body-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Inter"]
                    },
                    "fontSize": {
                        "title-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "label-caps": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700" }],
                        "body-sm": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "22px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "18px", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "display-lg": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-screen overflow-hidden antialiased">
<!-- Mock Background for Context -->
<div aria-hidden="true" class="absolute inset-0 bg-surface-container-low flex">
<!-- Sidebar Mock -->
<aside class="w-sidebar-width h-full bg-white border-r border-outline-variant flex flex-col hidden md:flex">
<div class="h-16 flex items-center px-6 border-b border-outline-variant">
<span class="material-symbols-outlined text-primary text-2xl mr-3" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="font-headline-sm text-headline-sm font-bold text-primary">AI Production Suite</span>
</div>
<div class="p-6">
<div class="w-full h-8 bg-surface-container-high rounded mb-4"></div>
<div class="w-3/4 h-8 bg-surface-container-high rounded mb-4"></div>
<div class="w-5/6 h-8 bg-surface-container-high rounded"></div>
</div>
</aside>
<!-- Main Content Area Mock -->
<main class="flex-1 flex flex-col">
<!-- Topbar Mock -->
<header class="h-16 bg-white border-b border-outline-variant flex items-center justify-between px-6">
<div class="flex space-x-6">
<div class="w-16 h-4 bg-surface-container-high rounded"></div>
<div class="w-20 h-4 bg-primary-fixed rounded"></div>
<div class="w-24 h-4 bg-surface-container-high rounded"></div>
</div>
<div class="flex space-x-4 items-center">
<div class="w-8 h-8 bg-surface-container-high rounded-full"></div>
<div class="w-8 h-8 bg-surface-container-high rounded-full"></div>
</div>
</header>
<!-- Content Canvas Mock -->
<div class="flex-1 p-8 grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 bg-white rounded-xl border border-outline-variant p-6 h-[600px] flex items-center justify-center">
<div class="w-64 h-64 border-4 border-surface-container-high rounded-full border-t-primary animate-spin"></div>
</div>
<div class="bg-white rounded-xl border border-outline-variant p-6 h-[600px]">
<div class="w-full h-40 bg-surface-container-high rounded-lg mb-6"></div>
<div class="space-y-4">
<div class="w-full h-4 bg-surface-container-high rounded"></div>
<div class="w-5/6 h-4 bg-surface-container-high rounded"></div>
<div class="w-4/6 h-4 bg-surface-container-high rounded"></div>
</div>
</div>
</div>
</main>
</div>
<!-- Overlay / Backdrop -->
<div class="absolute inset-0 bg-on-background/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
<!-- Modal Dialog -->
<div class="bg-surface-container-lowest rounded-xl shadow-[0_12px_24px_-4px_rgba(0,93,170,0.08)] border border-outline-variant w-full max-w-lg overflow-hidden flex flex-col transform transition-all">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-surface-bright">
<h2 class="font-headline-sm text-headline-sm text-on-surface">PPT 导出参数配置</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg space-y-xl overflow-y-auto">
<!-- Format Selection -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">导出格式</label>
<div class="grid grid-cols-2 gap-md">
<label class="relative flex items-center justify-center p-md border-2 border-primary bg-primary-fixed/20 rounded-lg cursor-pointer transition-colors group">
<input checked="" class="sr-only" name="format" type="radio" value="pptx"/>
<span class="material-symbols-outlined text-primary mr-2" style="font-variation-settings: 'FILL' 1;">slideshow</span>
<span class="font-body-md text-body-md font-semibold text-primary">PPTX (源文件)</span>
<div class="absolute top-2 right-2 w-4 h-4 rounded-full border-2 border-primary flex items-center justify-center bg-primary">
<span class="material-symbols-outlined text-[10px] text-white font-bold" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</label>
<label class="relative flex items-center justify-center p-md border border-outline-variant bg-surface-bright rounded-lg cursor-pointer hover:border-primary/50 hover:bg-surface-container-low transition-colors group">
<input class="sr-only" name="format" type="radio" value="pdf"/>
<span class="material-symbols-outlined text-on-surface-variant mr-2 group-hover:text-primary transition-colors">picture_as_pdf</span>
<span class="font-body-md text-body-md text-on-surface group-hover:text-primary transition-colors">PDF (便携文档)</span>
</label>
</div>
</div>
<!-- Page Range -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">页面范围</label>
<div class="flex flex-wrap gap-sm">
<label class="flex items-center space-x-2 cursor-pointer">
<input checked="" class="text-primary border-outline-variant focus:ring-primary focus:ring-offset-0 bg-surface h-4 w-4" name="range" type="radio" value="all"/>
<span class="font-body-md text-body-md text-on-surface">全部页面</span>
</label>
<label class="flex items-center space-x-2 cursor-pointer ml-4">
<input class="text-primary border-outline-variant focus:ring-primary focus:ring-offset-0 bg-surface h-4 w-4" name="range" type="radio" value="current"/>
<span class="font-body-md text-body-md text-on-surface">当前页</span>
</label>
<label class="flex items-center space-x-2 cursor-pointer ml-4">
<input class="text-primary border-outline-variant focus:ring-primary focus:ring-offset-0 bg-surface h-4 w-4" name="range" type="radio" value="custom"/>
<span class="font-body-md text-body-md text-on-surface">自定义</span>
</label>
</div>
<div class="mt-2 hidden">
<input class="w-full border border-outline-variant rounded-lg p-2 font-body-sm text-body-sm focus:border-primary focus:ring-1 focus:ring-primary bg-surface outline-none" placeholder="例如: 1-5, 8, 11-13" type="text"/>
</div>
</div>
<!-- Export Quality -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">导出质量</label>
<div class="flex bg-surface-container-low p-1 rounded-lg border border-outline-variant">
<button class="flex-1 py-2 text-center rounded bg-white shadow-sm border border-outline-variant font-body-sm text-body-sm font-semibold text-primary">
                            标准 (推荐)
                        </button>
<button class="flex-1 py-2 text-center rounded font-body-sm text-body-sm text-on-surface-variant hover:text-on-surface transition-colors">
                            高清 (1080p)
                        </button>
</div>
<p class="font-label-md text-label-md text-on-surface-variant mt-1">标准质量体积更小，适合快速分享与预览。</p>
</div>
<!-- Watermark Settings -->
<div class="space-y-sm pt-4 border-t border-outline-variant">
<label class="flex items-center justify-between cursor-pointer">
<div>
<span class="block font-body-md text-body-md font-semibold text-on-surface">添加企业水印</span>
<span class="block font-label-md text-label-md text-on-surface-variant mt-0.5">导出文件中将包含预设的品牌水印</span>
</div>
<div class="relative">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-container-highest peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</div>
</label>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-bright flex justify-end space-x-sm">
<button class="px-6 py-2.5 rounded-lg border border-outline-variant font-label-md text-label-md font-semibold text-on-surface hover:bg-surface-container-low transition-colors">
                    取消
                </button>
<button class="px-6 py-2.5 rounded-lg bg-primary font-label-md text-label-md font-semibold text-on-primary hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm flex items-center">
<span class="material-symbols-outlined text-[18px] mr-2">download</span>
                    确认导出
                </button>
</div>
</div>
</div>
</body></html>
