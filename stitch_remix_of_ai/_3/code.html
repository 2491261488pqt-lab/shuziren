<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Export Configuration Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed-variant": "#614000",
                    "secondary-fixed-dim": "#6de039",
                    "tertiary": "#7d5400",
                    "surface-tint": "#005fae",
                    "primary-fixed-dim": "#a5c8ff",
                    "on-tertiary-container": "#fffbff",
                    "error": "#ba1a1a",
                    "inverse-primary": "#a5c8ff",
                    "on-surface-variant": "#404753",
                    "surface-bright": "#faf9f9",
                    "surface-dim": "#dbdad9",
                    "on-primary-container": "#fefcff",
                    "surface-container-highest": "#e3e2e2",
                    "on-secondary-container": "#287100",
                    "primary-container": "#0075d5",
                    "inverse-surface": "#2f3031",
                    "on-surface": "#1b1c1c",
                    "surface": "#faf9f9",
                    "outline-variant": "#c0c7d6",
                    "tertiary-container": "#9d6a00",
                    "primary-fixed": "#d4e3ff",
                    "background": "#faf9f9",
                    "on-primary-fixed": "#001c3a",
                    "on-tertiary": "#ffffff",
                    "on-primary-fixed-variant": "#004785",
                    "on-error": "#ffffff",
                    "error-container": "#ffdad6",
                    "secondary": "#266d00",
                    "surface-container-high": "#e9e8e8",
                    "secondary-container": "#85fa51",
                    "tertiary-fixed": "#ffddb0",
                    "on-primary": "#ffffff",
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#88fd54",
                    "inverse-on-surface": "#f2f0f0",
                    "tertiary-fixed-dim": "#ffba45",
                    "surface-container-low": "#f4f3f3",
                    "on-secondary-fixed": "#062100",
                    "on-secondary-fixed-variant": "#1a5200",
                    "on-tertiary-fixed": "#281800",
                    "surface-container": "#efeded",
                    "surface-variant": "#e3e2e2",
                    "outline": "#707785",
                    "on-background": "#1b1c1c",
                    "on-error-container": "#93000a",
                    "primary": "#005daa"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "xs": "8px",
                    "lg": "24px",
                    "sidebar-width": "240px",
                    "sm": "12px",
                    "base": "4px",
                    "gutter": "16px",
                    "md": "16px",
                    "xl": "32px",
                    "container-margin": "24px"
            },
            "fontFamily": {
                    "body-md": [
                            "Inter"
                    ],
                    "headline-md": [
                            "Inter"
                    ],
                    "headline-sm": [
                            "Inter"
                    ],
                    "label-md": [
                            "Inter"
                    ],
                    "label-caps": [
                            "Inter"
                    ],
                    "body-sm": [
                            "Inter"
                    ],
                    "display-lg": [
                            "Inter"
                    ],
                    "title-lg": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "body-md": [
                            "14px",
                            {
                                    "lineHeight": "22px",
                                    "fontWeight": "400"
                            }
                    ],
                    "headline-md": [
                            "24px",
                            {
                                    "lineHeight": "32px",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"
                            }
                    ],
                    "headline-sm": [
                            "20px",
                            {
                                    "lineHeight": "28px",
                                    "fontWeight": "600"
                            }
                    ],
                    "label-md": [
                            "12px",
                            {
                                    "lineHeight": "18px",
                                    "letterSpacing": "0.01em",
                                    "fontWeight": "500"
                            }
                    ],
                    "label-caps": [
                            "11px",
                            {
                                    "lineHeight": "16px",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-sm": [
                            "13px",
                            {
                                    "lineHeight": "20px",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-lg": [
                            "30px",
                            {
                                    "lineHeight": "38px",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "title-lg": [
                            "16px",
                            {
                                    "lineHeight": "24px",
                                    "fontWeight": "600"
                            }
                    ]
            }
          }
        }
      }
    </script>
<style>
        body {
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }
        
        .custom-radio:checked + div {
            border-color: #005daa;
            background-color: #e6f7ff;
        }
        
        .custom-radio:checked + div .radio-inner {
            background-color: #005daa;
        }
    </style>
</head>
<body>
<!-- Modal Container -->
<div class="fixed inset-0 flex items-center justify-center bg-black/40 z-50">
<div class="bg-surface-container-lowest rounded-xl shadow-[0_8px_24px_rgba(0,28,58,0.08)] w-full max-w-[560px] mx-md overflow-hidden flex flex-col border border-outline-variant">
<!-- Header -->
<div class="px-lg py-md border-b border-outline-variant flex justify-between items-center bg-surface">
<h2 class="font-title-lg text-title-lg text-on-surface">导出课程资料</h2>
<button class="text-on-surface-variant hover:text-on-surface transition-colors p-1 rounded-full hover:bg-surface-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg">
<!-- Format Selection -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm uppercase tracking-wider">格式</label>
<div class="grid grid-cols-2 gap-sm">
<!-- PPTX Option -->
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only custom-radio" name="format" type="radio" value="pptx"/>
<div class="border border-outline-variant rounded-lg p-sm flex items-center gap-sm transition-all hover:border-primary-fixed-dim">
<div class="w-4 h-4 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary radio-outer">
<div class="w-2 h-2 rounded-full radio-inner transition-colors"></div>
</div>
<span class="material-symbols-outlined text-[#d32f2f]" style="font-variation-settings: 'FILL' 1;">slideshow</span>
<div>
<div class="font-body-md text-body-md text-on-surface font-medium">PowerPoint (.pptx)</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">可编辑格式</div>
</div>
</div>
</label>
<!-- PDF Option -->
<label class="relative cursor-pointer group">
<input class="peer sr-only custom-radio" name="format" type="radio" value="pdf"/>
<div class="border border-outline-variant rounded-lg p-sm flex items-center gap-sm transition-all hover:border-primary-fixed-dim">
<div class="w-4 h-4 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary radio-outer">
<div class="w-2 h-2 rounded-full radio-inner transition-colors"></div>
</div>
<span class="material-symbols-outlined text-[#f40f02]" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
<div>
<div class="font-body-md text-body-md text-on-surface font-medium">PDF文档 (.pdf)</div>
<div class="font-body-sm text-body-sm text-on-surface-variant">仅供查看与打印</div>
</div>
</div>
</label>
</div>
</div>
<!-- Page Range -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm uppercase tracking-wider">页面范围</label>
<div class="flex flex-col gap-sm">
<label class="flex items-center gap-sm cursor-pointer">
<input checked="" class="text-primary focus:ring-primary h-4 w-4 border-outline-variant bg-surface" name="pages" type="radio" value="all"/>
<span class="font-body-md text-body-md text-on-surface">全部页面 (42页)</span>
</label>
<label class="flex items-center gap-sm cursor-pointer">
<input class="text-primary focus:ring-primary h-4 w-4 border-outline-variant bg-surface" name="pages" type="radio" value="current"/>
<span class="font-body-md text-body-md text-on-surface">当前页面 (第 5 页)</span>
</label>
<div class="flex items-center gap-sm">
<label class="flex items-center gap-sm cursor-pointer flex-shrink-0">
<input class="text-primary focus:ring-primary h-4 w-4 border-outline-variant bg-surface" id="custom-pages-radio" name="pages" type="radio" value="custom"/>
<span class="font-body-md text-body-md text-on-surface">自定义范围</span>
</label>
<input class="flex-grow ml-xs border-outline-variant rounded focus:border-primary focus:ring-primary text-body-sm px-sm py-1 disabled:bg-surface-container-low disabled:text-outline" disabled="" id="custom-pages-input" placeholder="例如: 1-5, 8, 11-13" type="text"/>
</div>
</div>
</div>
<!-- Quality -->
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-sm uppercase tracking-wider">导出质量</label>
<select class="w-full border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:border-primary focus:ring-primary py-2 px-sm bg-surface">
<option value="standard">标准 (适合网页浏览)</option>
<option value="high">高 (打印质量)</option>
<option value="maximum">最高 (未压缩资源)</option>
</select>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-outline-variant bg-surface-container-lowest flex justify-end items-center gap-md">
<button class="font-body-md text-body-md text-on-surface-variant hover:text-on-surface font-medium px-md py-2 rounded transition-colors">
                取消
            </button>
<button class="bg-primary text-on-primary font-body-md text-body-md font-medium px-lg py-2 rounded-lg hover:bg-on-primary-fixed-variant transition-colors flex items-center gap-xs shadow-sm">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">download</span>
                确认导出
            </button>
</div>
</div>
</div>
<script>
        // Simple script to toggle custom pages input
        const customRadio = document.getElementById('custom-pages-radio');
        const customInput = document.getElementById('custom-pages-input');
        const pageRadios = document.querySelectorAll('input[name="pages"]');

        pageRadios.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'custom') {
                    customInput.disabled = false;
                    customInput.focus();
                } else {
                    customInput.disabled = true;
                    customInput.value = ''; // Optional: clear input when disabled
                }
            });
        });
    </script>
</body></html>
